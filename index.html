<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sudoku Move Logger</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Sudoku Move Logger</h1>
        <p>Load a puzzle string, start solving, then download your move replay.</p>
      </header>

      <section class="controls">
        <label for="puzzle-input">Puzzle string (81 chars, 1-9 and . or 0 for blanks)</label>
        <textarea
          id="puzzle-input"
          rows="2"
          placeholder="..3.2.6..9..3.5..1..18.64..81.29..7.......8..67.82..26.95..8..2.3..9..5.1.3.."
        ></textarea>
        <div class="button-row">
          <button id="load-btn">Load puzzle</button>
          <button id="start-btn" disabled>Start solving</button>
        </div>
        <div class="button-row">
          <button id="download-json" disabled>Download JSON replay</button>
          <button id="download-csv" disabled>Download CSV replay</button>
        </div>
        <p id="status" class="status"></p>
      </section>

      <section class="board-area">
        <div id="sudoku-grid" class="sudoku-grid" aria-label="Sudoku grid"></div>
        <div class="numpad" aria-label="Number pad">
          <button class="numpad-btn" data-digit="1">1</button>
          <button class="numpad-btn" data-digit="2">2</button>
          <button class="numpad-btn" data-digit="3">3</button>
          <button class="numpad-btn" data-digit="4">4</button>
          <button class="numpad-btn" data-digit="5">5</button>
          <button class="numpad-btn" data-digit="6">6</button>
          <button class="numpad-btn" data-digit="7">7</button>
          <button class="numpad-btn" data-digit="8">8</button>
          <button class="numpad-btn" data-digit="9">9</button>
          <button class="numpad-btn clear" data-digit="clear">Clear</button>
        </div>
      </section>

      <footer class="how-it-works">
        <h2>How it works</h2>
        <p>
          This tool logs only your Sudoku moves in your browser. Click “Download JSON replay”
          or “Download CSV replay” to save your data and send it to the researcher.
        </p>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
